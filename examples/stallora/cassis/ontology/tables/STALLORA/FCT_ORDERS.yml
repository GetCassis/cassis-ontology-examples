columns:
- data_type: TEXT
  description: Order this row describes. One row per order.
  name: ORDER_ID
  ordinal: 0
- data_type: TEXT
  description: Per-order customer record. Join CUSTOMERS for CUSTOMER_UNIQUE_ID, city and country.
  name: CUSTOMER_ID
  ordinal: 1
- data_type: TEXT
  description: Fulfillment status of the order (delivered, shipped, canceled, ...). Realized sales are 'delivered'; IS_DELIVERED
    carries this as a flag.
  name: ORDER_STATUS
  ordinal: 2
  synonyms:
  - status
- data_type: TIMESTAMP_NTZ
  description: When the order was placed.
  name: ORDER_PURCHASE_TIMESTAMP
  ordinal: 3
  synonyms:
  - order date
  - purchase date
- data_type: TIMESTAMP_NTZ
  description: When the order was delivered to the customer. Null if not delivered.
  name: ORDER_DELIVERED_CUSTOMER_DATE
  ordinal: 4
- data_type: TIMESTAMP_NTZ
  description: Delivery date promised at purchase.
  name: ORDER_ESTIMATED_DELIVERY_DATE
  ordinal: 5
- data_type: BOOLEAN
  description: True when the order status is 'delivered'. Filter on this for realized sales.
  name: IS_DELIVERED
  ordinal: 6
- data_type: BOOLEAN
  description: True when a delivered order arrived on or before its estimated delivery date. Null/false otherwise. Basis of
    the on_time_delivery_rate and late_delivery_rate metrics.
  name: IS_ON_TIME
  ordinal: 7
  synonyms:
  - on time
- data_type: NUMBER
  description: Days from purchase to delivery for delivered orders. Basis of the average_delivery_time metric.
  name: DELIVERY_DAYS
  ordinal: 8
  synonyms:
  - delivery time
  unit: days
- data_type: FLOAT
  description: Total sales amount of the order in EUR (sum of the order's item PRICE, excluding freight). Use for order-level
    totals and AOV; for sales by product, category or seller use ORDER_ITEMS.PRICE.
  name: ORDER_VALUE
  ordinal: 9
  synonyms:
  - order total
  - basket value
  unit: EUR
- data_type: FLOAT
  description: Total shipping charged on the order, in EUR.
  name: FREIGHT_VALUE
  ordinal: 10
  synonyms:
  - shipping
  unit: EUR
- data_type: NUMBER
  description: Number of order lines in the order.
  name: ITEM_COUNT
  ordinal: 11
  unit: count
- data_type: NUMBER
  description: Number of distinct sellers in the order. Greater than 1 marks a multi-seller order (about 1.3% of orders).
  name: SELLER_COUNT
  ordinal: 12
  unit: count
- data_type: NUMBER
  description: The order's review score, 1 to 5, averaged if the order has more than one review. Null if the order has no
    review.
  name: REVIEW_SCORE
  ordinal: 13
  synonyms:
  - rating
  unit: score
description: Curated order-grain fact, one row per order. Built from ORDERS (status and delivery timestamps), ORDER_ITEMS
  (summed to ORDER_VALUE, FREIGHT_VALUE, ITEM_COUNT and SELLER_COUNT per order) and ORDER_REVIEWS (averaged to one REVIEW_SCORE
  per order). Precomputes IS_DELIVERED, IS_ON_TIME and DELIVERY_DAYS so order-level questions (AOV, on-time rate, cancellation,
  delivery time, review) are direct. ORDER_VALUE is the per-order sales total; for sales broken down by product, category
  or seller use ORDER_ITEMS instead.
domain_path: marketplace
grain:
- ORDER_ID
schema_name: STALLORA
synonyms:
- order fact
- orders fact
table_name: FCT_ORDERS
